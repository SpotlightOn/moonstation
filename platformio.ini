; PlatformIO project - moonstation (ESP-IDF, Spotpear ESP32-S3 1.28" BOX)

[platformio]
default_envs = spotpear_esp32s3

[env:spotpear_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.f_cpu = 80000000L

upload_speed = 921600
monitor_speed = 115200

; Project root on the include path so config.h resolves.
build_flags =
    -I.

; Managed ESP-IDF components are declared in src/idf_component.yml.

<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Moonstation first setup</title>
<link rel='stylesheet' href='/page.css'>
<script src='/setup.js' defer></script>
</head>
<body class='narrow'>
<h1>Set up your login</h1>
<p>This box still uses the factory login <b>admin / admin</b>. Choose your own
user and password before the settings page opens. The page is only reachable in
the local network, but with the factory login anyone in it could reconfigure
the box.</p>
<form id='c'>
<label for='u'>User</label>
<input id='u' autocomplete='username' value='admin'>
<label for='p'>New password</label>
<input id='p' type='password' autocomplete='new-password'>
<label for='p2'>New password again</label>
<input id='p2' type='password' autocomplete='new-password'>
<button type='submit'>Save login</button>
</form>
<p id='m'></p>
</body>
</html>

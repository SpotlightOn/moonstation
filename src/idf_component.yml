dependencies:
  espressif/esp_lcd_gc9a01: "^2.0.0"
  espressif/esp_lcd_touch: "^1.0.0"
  espressif/esp_lcd_touch_cst816s: "^1.0.0"
  espressif/esp_codec_dev: "^1.0.0"
  espressif/esp_new_jpeg: "^1.0.2"
  # cJSON moved out of the IDF tree, the weather mode needs it to read the
  # OpenWeather answers.
  espressif/cjson: "^1.7.19"
  # MP3 decoder of the radio mode: fixed point, about 30 kB, no IDF APIs. The
  # component is pure C, so it does not care about the IDF version.
  chmorgan/esp-libhelix-mp3: "^1.0.3"
  # H.264 decoder of the movie mode: software decoding on the S3, about 1 MB
  # of PSRAM for a 240x240 stream. The encoder half is ESP32-P4 only; the
  # build only uses the decoder.
  espressif/esp_h264: "^1.4.1"
  idf:
    version: ">=6.0.0"
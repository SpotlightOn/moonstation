name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Keep in sync with ci.yml.
  CACHE_VERSION: v1
  PLATFORMIO_VERSION: "6.2.0"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same split as ci.yml: toolchain packages keyed on the platform pin,
      # pip wheels on the PlatformIO version.
      - name: Cache PlatformIO toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-toolchain-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-toolchain-${{ env.CACHE_VERSION }}-${{ runner.os }}-

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pio-pip-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}
          restore-keys: |
            pio-pip-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Prepare config.h
        run: cp config.h.example config.h

      - name: Build
        run: pio run

      - name: Merge flash image
        run: |
          pip install "esptool<5"
          build=.pio/build/spotpear_esp32s3
          python -m esptool --chip esp32s3 merge_bin \
            -o "moonstation-${GITHUB_REF_NAME}-flash.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 "$build/bootloader.bin" \
            0x8000 "$build/partitions.bin" \
            0x10000 "$build/firmware.bin"

      - name: Collect artifacts
        run: |
          build=.pio/build/spotpear_esp32s3
          mkdir -p out
          cp "$build/firmware.bin" "$build/bootloader.bin" "$build/partitions.bin" \
            "moonstation-${GITHUB_REF_NAME}-flash.bin" out/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Flash the merged image in one go:

            ```
            esptool.py --chip esp32s3 write_flash 0x0 moonstation-${GITHUB_REF_NAME}-flash.bin
            ```

            Or flash the individual files: `bootloader.bin` at `0x0`,
            `partitions.bin` at `0x8000`, `firmware.bin` at `0x10000`.

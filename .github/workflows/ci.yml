name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump to drop the PlatformIO caches after a toolchain layout change.
  CACHE_VERSION: v1
  # Pinned so the pip wheel cache stays valid and CI stays reproducible.
  PLATFORMIO_VERSION: "6.2.0"

jobs:
  check:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Prepare config.h
        run: cp config.h.example config.h

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c11 \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --template='{file}:{line}: {severity}: {message}' \
            -j "$(nproc)" \
            -I. \
            src

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Toolchain and platform packages only change when the platform pin in
      # platformio.ini moves, so they get their own cache instead of sharing a
      # key with the pip cache. A key per file is a cache hit in almost every
      # run, which matters because this archive is the slowest thing to restore.
      #
      # ~/.platformio/.cache (the download archives) is left out on purpose:
      # those are already compressed tarballs, so they roughly double the
      # archive size, cannot be compressed again, and a cache hit never needs
      # them. Only a cold run downloads the packages.
      - name: Cache PlatformIO toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-toolchain-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-toolchain-${{ env.CACHE_VERSION }}-${{ runner.os }}-

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pio-pip-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}
          restore-keys: |
            pio-pip-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Prepare config.h
        run: cp config.h.example config.h

      - name: Build
        run: pio run

      - name: Collect firmware
        run: |
          build=.pio/build/spotpear_esp32s3
          mkdir -p out
          cp "$build/firmware.bin" "$build/bootloader.bin" "$build/partitions.bin" out/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: out/
          if-no-files-found: error
